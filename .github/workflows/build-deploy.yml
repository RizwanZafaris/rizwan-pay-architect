# Build & deploy rzifi.com — replaces laptop deploys with a pipeline.
#
# Triggers:
#   - push to main: every merged PR goes live without a manual deploy
#   - daily cron 23:30 UTC (≈ 03:30 GST / 04:30 PKT): flips scheduled essays
#     live on their publishDate — the content drip (next: 2026-06-12) depends
#     on a rebuild, since noindex/sitemap gating is baked at build time
#   - workflow_dispatch: manual runs from the Actions tab
#
# Pipeline: bun build:static → seo:audit (banned-claims + schema + canonical
# gates; a failure here blocks the deploy) → publish dist-static/ onto the
# hostinger-static branch (Hostinger auto-pulls it via webhook).
name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-static
  cancel-in-progress: false

permissions:
  contents: write
  issues: write # failure notifications
  actions: write # cron keepalive (re-enable after 60-day inactivity timer)

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build:static

      - name: SEO + banned-claims gate
        run: bun run seo:audit

      - name: Publish to hostinger-static
        env:
          SKIP_REBUILD: "1" # dist-static was just built and gated above
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/deploy-git-static.sh

      # GitHub disables scheduled workflows after 60 days without repo
      # activity — the drip publishing and the daily live probe would die
      # silently together. Each cron run re-arms the timer.
      - name: Cron keepalive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build-deploy.yml/enable" || true

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Deploy pipeline failed: ${{ github.workflow }} #${{ github.run_number }}" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (trigger: ${{ github.event_name }}). The site was NOT updated — investigate before the next cron." \
            || true

  live-check:
    needs: build-deploy
    runs-on: ubuntu-latest
    # Propagation flake (webhook pull + hCDN max-age=300) is absorbed by the
    # 420s wait below; a failure after that is real and must notify.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Wait for Hostinger pull + CDN TTL
        run: sleep 420

      - name: Probe live site
        run: bun scripts/check-live.ts

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Live-site probe failed after deploy #${{ github.run_number }}" \
            --body "check-live.ts found the deployed site unhealthy: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true
